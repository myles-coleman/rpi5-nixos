name: Build & Deploy NixOS Nodes

on:
  push:
    branches: [main]
    paths-ignore: [README.md]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      nodes:
        description: 'Nodes to build/deploy (comma-separated or "all")'
        required: true
        default: 'all'
      deploy:
        description: 'Deploy to physical nodes after build'
        required: true
        default: false
        type: boolean

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Build — native aarch64, populate Cachix cache
  # ---------------------------------------------------------------------------
  build:
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        node: [0, 1, 2, 3, 4]
      fail-fast: false

    steps:
      - name: Check if node should be built
        id: check_node
        run: |
          NODES_INPUT="${{ github.event.inputs.nodes || 'all' }}"
          CURRENT_NODE="${{ matrix.node }}"

          # Map node number to IP address (used by deploy job)
          case $CURRENT_NODE in
            0) NODE_IP="10.0.0.140" ;;
            1) NODE_IP="10.0.0.141" ;;
            2) NODE_IP="10.0.0.142" ;;
            3) NODE_IP="10.0.0.143" ;;
            4) NODE_IP="10.0.0.144" ;;
          esac
          echo "node_ip=$NODE_IP" >> $GITHUB_OUTPUT

          if [ "$NODES_INPUT" = "all" ]; then
            echo "build=true" >> $GITHUB_OUTPUT
          elif echo "$NODES_INPUT" | grep -qw "$CURRENT_NODE"; then
            echo "build=true" >> $GITHUB_OUTPUT
          else
            echo "build=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout
        if: steps.check_node.outputs.build == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Nix
        if: steps.check_node.outputs.build == 'true'
        uses: cachix/install-nix-action@96951a3bbe20ce196012edb66ff8e45f1ee3660a # v31.10.3
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-substituters = https://nixos-raspberrypi.cachix.org https://rpi5-k3s.cachix.org
            extra-trusted-public-keys = nixos-raspberrypi.cachix.org-1:4iMO9LXa8BqhU+Rpg6LQKiGa2lsNh/j2oiYLNOQ5sPI= rpi5-k3s.cachix.org-1:SH8ZlBgEj/jr0Facr2dnlXOyH7vzUe5W5YYQn70L7KA=

      - name: Setup Cachix
        if: steps.check_node.outputs.build == 'true'
        uses: cachix/cachix-action@1eb2ef6fd2bbe8351e780770e7d57e5e3afbd744 # v17
        with:
          name: rpi5-k3s
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Create placeholder K3s token
        if: steps.check_node.outputs.build == 'true'
        run: |
          echo "placeholder" > token
          git add -f token

      - name: Build node${{ matrix.node }}
        if: steps.check_node.outputs.build == 'true'
        run: |
          nix build \
            .#nixosConfigurations.node${{ matrix.node }}.config.system.build.toplevel \
            --no-link --print-out-paths -L

  # ---------------------------------------------------------------------------
  # Job 2: Deploy — only on dispatch with deploy: true
  # ---------------------------------------------------------------------------
  deploy:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true'
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [0, 1, 2, 3, 4]
      fail-fast: false
      max-parallel: 1

    steps:
      - name: Check if node should be deployed
        id: check_node
        run: |
          NODES_INPUT="${{ github.event.inputs.nodes || 'all' }}"
          CURRENT_NODE="${{ matrix.node }}"

          case $CURRENT_NODE in
            0) NODE_IP="10.0.0.140" ;;
            1) NODE_IP="10.0.0.141" ;;
            2) NODE_IP="10.0.0.142" ;;
            3) NODE_IP="10.0.0.143" ;;
            4) NODE_IP="10.0.0.144" ;;
          esac
          echo "node_ip=$NODE_IP" >> $GITHUB_OUTPUT

          if [ "$NODES_INPUT" = "all" ]; then
            echo "deploy=true" >> $GITHUB_OUTPUT
          elif echo "$NODES_INPUT" | grep -qw "$CURRENT_NODE"; then
            echo "deploy=true" >> $GITHUB_OUTPUT
          else
            echo "deploy=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout
        if: steps.check_node.outputs.deploy == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Nix
        if: steps.check_node.outputs.deploy == 'true'
        uses: cachix/install-nix-action@96951a3bbe20ce196012edb66ff8e45f1ee3660a # v31.10.3
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-substituters = https://nixos-raspberrypi.cachix.org https://rpi5-k3s.cachix.org
            extra-trusted-public-keys = nixos-raspberrypi.cachix.org-1:4iMO9LXa8BqhU+Rpg6LQKiGa2lsNh/j2oiYLNOQ5sPI= rpi5-k3s.cachix.org-1:SH8ZlBgEj/jr0Facr2dnlXOyH7vzUe5W5YYQn70L7KA=

      - name: Setup SSH key
        if: steps.check_node.outputs.deploy == 'true'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          cat > ~/.ssh/config <<EOF
          Host *
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            ControlMaster no
          EOF
          chmod 600 ~/.ssh/config

      - name: Tailscale
        if: steps.check_node.outputs.deploy == 'true'
        uses: tailscale/github-action@e274181ee44bc6e5c0e2c657a5a23cd2b4ef2c48 # v4.1.2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Accept Tailscale routes
        if: steps.check_node.outputs.deploy == 'true'
        run: sudo tailscale set --accept-routes

      - name: Set Nameservers
        if: steps.check_node.outputs.deploy == 'true'
        run: |
          echo "nameserver 8.8.8.8" | sudo tee /etc/resolv.conf > /dev/null
          echo "nameserver 8.8.4.4" | sudo tee -a /etc/resolv.conf > /dev/null

      - name: Setup K3s Token
        if: steps.check_node.outputs.deploy == 'true'
        run: |
          echo "${{ secrets.K3S_TOKEN }}" > token
          git add -f token

      - name: Deploy to node${{ matrix.node }}
        if: steps.check_node.outputs.deploy == 'true'
        run: |
          echo "Deploying to node${{ matrix.node }} (${{ steps.check_node.outputs.node_ip }})..."
          nix run nixpkgs#nixos-rebuild -- switch \
            --flake .#node${{ matrix.node }} \
            --target-host pi@${{ steps.check_node.outputs.node_ip }} \
            --use-remote-sudo \
            --build-host pi@${{ steps.check_node.outputs.node_ip }}

      - name: Verify node health
        if: steps.check_node.outputs.deploy == 'true'
        run: |
          echo "Verifying node${{ matrix.node }} health..."
          ssh pi@${{ steps.check_node.outputs.node_ip }} "systemctl is-active k3s || systemctl is-active k3s-agent"
